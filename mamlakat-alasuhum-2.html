<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل جديد مجاني | مملكة الأسهم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --ink:#060b1c;
  --navy:#0b1330;
  --panel:#12121a;
  --field:#1f212b;
  --field-2:#2a2d3a;
  --gold:#d9ad4f;
  --gold-soft:#f0d28a;
  --text:#f4efe2;
  --muted:#9a9db0;
  --danger:#ff8a80;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background:#0c0c10;color:var(--text);
  font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;
  min-height:100vh;
}
header.top{
  background:var(--ink);
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid #1a2140;
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.brand svg{width:46px;height:46px;flex:none}
.brand b{display:block;font-size:20px;font-weight:700;letter-spacing:0;color:var(--gold-soft);line-height:1.2}
.brand small{display:block;font-size:11px;color:var(--muted);line-height:1.2}
.burger{
  width:52px;height:46px;border-radius:10px;background:transparent;
  border:2px solid #2b3560;display:grid;place-content:center;gap:6px;cursor:pointer;
}
.burger span{display:block;width:26px;height:3px;background:var(--text);border-radius:2px}
.burger:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

main{max-width:520px;margin:0 auto;background:var(--panel);min-height:calc(100vh - 80px);border-inline:1px solid #1a2140}
.hero{
  background:var(--navy);padding:34px 20px;text-align:center;
  border-bottom:3px solid var(--gold);
}
.hero h1{margin:0;font-size:28px;font-weight:700}
.lead{margin:30px 24px 22px;font-size:20px;font-weight:500}
form{padding:0 24px 40px;display:grid;gap:18px}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--muted)}
input,select{
  width:100%;height:58px;border:1px solid transparent;border-radius:16px;
  background:var(--field);color:var(--text);
  font:inherit;font-size:17px;padding:0 20px;
}
input::placeholder{color:#8b8e9f}
input[type=email],input[type=tel]{direction:ltr;text-align:right}
select{
  background:var(--field-2);appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='10' viewBox='0 0 16 10'><path d='M1 1l7 7 7-7' fill='none' stroke='%239a9db0' stroke-width='2'/></svg>");
  background-repeat:no-repeat;background-position:left 18px center;
}
input:focus,select:focus{border-color:var(--gold)}
.field.bad input,.field.bad select{border-color:var(--danger)}
.err{display:none;color:var(--danger);font-size:13px}
.field.bad .err{display:block}
.btn{
  justify-self:center;margin-top:10px;min-width:170px;height:56px;border:0;border-radius:14px;
  background:var(--gold);color:#1a1405;font:inherit;font-size:19px;font-weight:700;cursor:pointer;
  transition:transform .12s ease,background .12s ease;
}
.btn:hover{background:var(--gold-soft)}
.btn:active{transform:scale(.97)}
.done{display:none;text-align:center;padding:50px 24px}
.done svg{width:64px;height:64px}
.done h2{margin:16px 0 8px;font-size:24px}
.done p{margin:0;color:var(--muted);line-height:1.8}
.is-done form,.is-done .lead{display:none}
.is-done .done{display:block}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#" aria-label="مملكة الأسهم">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M8 46 L12 20 L24 33 L32 14 L40 33 L52 20 L56 46 Z" fill="none" stroke="#d9ad4f" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="12" cy="18" r="3" fill="#d9ad4f"/><circle cx="32" cy="11" r="3" fill="#d9ad4f"/><circle cx="52" cy="18" r="3" fill="#d9ad4f"/>
      <path d="M12 54 H52" stroke="#d9ad4f" stroke-width="3" stroke-linecap="round"/>
      <path d="M20 42 L28 36 L34 40 L44 28" fill="none" stroke="#f0d28a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span><b>مملكة الأسهم</b><small>تداول سعودي بوعي</small></span>
  </a>
  <button class="burger" type="button" aria-label="القائمة"><span></span><span></span><span></span></button>
</header>

<main id="card">
  <section class="hero"><h1>تسجيل جديد مجاني</h1></section>
  <p class="lead">سجل معنا واحصل على أفضل النتائج</p>

  <form id="f" novalidate>
    <div class="field">
      <input id="name" name="name" type="text" placeholder="الاسم" autocomplete="name" aria-label="الاسم">
      <span class="err">اكتب اسمك</span>
    </div>
    <div class="field">
      <input id="email" name="email" type="email" placeholder="البريد الالكتروني" autocomplete="email" aria-label="البريد الالكتروني">
      <span class="err">اكتب بريدًا إلكترونيًا صحيحًا</span>
    </div>
    <div class="field">
      <input id="phone" name="phone" type="tel" inputmode="tel" placeholder="رقم الجوال" autocomplete="tel" aria-label="رقم الجوال">
      <span class="err">اكتب رقم جوال صحيحًا</span>
    </div>
    <div class="field" style="margin-top:14px">
      <select id="liq" name="liq" aria-label="اختر السيولة">
        <option value="" selected disabled>اختر السيولة</option>
        <option>أقل من 10,000 ريال</option>
        <option>من 10,000 إلى 50,000 ريال</option>
        <option>من 50,000 إلى 200,000 ريال</option>
        <option>أكثر من 200,000 ريال</option>
      </select>
      <span class="err">اختر السيولة</span>
    </div>
    <div class="field">
      <select id="mkt" name="mkt" aria-label="اختر السوق">
        <option value="" selected disabled>اختر السوق</option>
        <option>السوق الرئيسي (تاسي)</option>
        <option>السوق الموازي (نمو)</option>
        <option>الأسواق الخليجية</option>
        <option>الأسواق الأمريكية</option>
      </select>
      <span class="err">اختر السوق</span>
    </div>
    <button class="btn" type="submit">تسجيل</button>
  </form>

  <div class="done" role="status" aria-live="polite">
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="none" stroke="#d9ad4f" stroke-width="3"/><path d="M19 33 L28 42 L46 23" fill="none" stroke="#f0d28a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h2>خطوة أخيرة</h2>
    <p id="doneMsg">أهلاً بك في مملكة الأسهم.</p>
    <p style="margin-top:22px"><a id="waBtn" class="btn" style="display:inline-grid;place-items:center;text-decoration:none;padding:0 26px" href="#">إرسال على واتساب</a></p>
  </div>
</main>

<script>
(function(){
  var f=document.getElementById('f'), card=document.getElementById('card');
  function set(id,ok){document.getElementById(id).closest('.field').classList.toggle('bad',!ok);return ok}
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var name=f.name.value.trim(), email=f.email.value.trim(), phone=f.phone.value.replace(/[\s\-]/g,'');
    var ok=[
      set('name',name.length>=2),
      set('email',/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)),
      set('phone',/^(\+|00)?\d{9,14}$/.test(phone)),
      set('liq',!!f.liq.value),
      set('mkt',!!f.mkt.value)
    ].every(Boolean);
    if(!ok){var b=f.querySelector('.bad input,.bad select'); if(b)b.focus(); return;}
    var msg='تسجيل جديد - مملكة الأسهم\n'+
      'الاسم: '+name+'\n'+
      'البريد: '+email+'\n'+
      'الجوال: '+f.phone.value.trim()+'\n'+
      'السيولة: '+f.liq.value+'\n'+
      'السوق: '+f.mkt.value;
    var url='https://wa.me/201142335583?text='+encodeURIComponent(msg);
    document.getElementById('doneMsg').textContent='أهلاً '+name+'، اضغط الزر التالي لإرسال بياناتك على واتساب لإتمام التسجيل.';
    document.getElementById('waBtn').href=url;
    card.classList.add('is-done');
    window.scrollTo(0,0);
    window.location.href=url;
  });
  f.addEventListener('input',function(e){var fl=e.target.closest('.field'); if(fl)fl.classList.remove('bad');});
})();
</script>
</body>
</html>
